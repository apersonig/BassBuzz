name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests and build
        run: ./gradlew :core:testDebugUnitTest :ldaf:testDebugUnitTest :ultrasonic:testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BassBuzz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BassBuzz-Player-debug-apk
          path: player/build/outputs/apk/debug/player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LDAF-Scope-debug-apk
          path: ldaf/build/outputs/apk/debug/ldaf-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrasonic-Tone-debug-apk
          path: ultrasonic/build/outputs/apk/debug/ultrasonic-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore
