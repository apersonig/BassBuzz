name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests and build
        run: |
          set -o pipefail
          ./gradlew :core:testDebugUnitTest :ldaf:testDebugUnitTest :ultrasonic:testDebugUnitTest :watchlauncher:testDebugUnitTest :ioslauncher:testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Surface errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|AAPT|Execution failed|Test .* FAILED|Exception" build.log | head -25 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: BassBuzz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BassBuzz-Player-debug-apk
          path: player/build/outputs/apk/debug/player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LDAF-Scope-debug-apk
          path: ldaf/build/outputs/apk/debug/ldaf-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrasonic-Tone-debug-apk
          path: ultrasonic/build/outputs/apk/debug/ultrasonic-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Watch-Launcher-debug-apk
          path: watchlauncher/build/outputs/apk/debug/watchlauncher-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Launcher-debug-apk
          path: ioslauncher/build/outputs/apk/debug/ioslauncher-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore
